<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm company email - Pinterest</title>
  </head>
  <body style="margin: 0; padding: 0; background: #f6f9fc; font-family: Arial, sans-serif;">
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background: linear-gradient(135deg, #f6f9fc, #e9eff5); padding: 40px 0;">
      <tr>
        <td align="center">
          <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 400px; background-color: #ffffff; border-radius: 20px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);">
            <tr>
              <td style="padding: 30px 40px; text-align: center;">
                <div style="font-size: 20px; color: #333; margin-bottom: 10px;">
                  Hi, {{username}}
                </div>
                <div style="font-size: 24px; color: #1d1f21; font-weight: bold; margin-bottom: 20px;">
                  Confirm company email
                </div>
                <div style="font-size: 16px; color: #555; line-height: 1.5; margin-bottom: 30px;">
                  Please confirm this email for your hiring-rights verification request.
                </div>
                <a href="{{link}}" target="_blank" style="display: inline-block; padding: 12px 24px; font-size: 16px; color: #ffffff; background-color: #e60023; text-decoration: none; border-radius: 50px; margin-bottom: 20px;">
                  Confirm
                </a>
                <div style="font-size: 14px; color: #777;">
                  If you did not request hiring rights, ignore this message.
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
